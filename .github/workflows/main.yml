name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Download Xray core (libv2ray.aar)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p NovaVPN/app/libs
          gh release download --repo 2dust/AndroidLibXrayLite --pattern 'libv2ray.aar' --dir NovaVPN/app/libs --clobber
          ls -la NovaVPN/app/libs

      - name: Download geoip.dat (Iran direct routing)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p NovaVPN/app/src/main/assets/geo
          gh release download --repo Chocolate4U/Iran-v2ray-rules --pattern 'geoip.dat' --dir NovaVPN/app/src/main/assets/geo --clobber \
            || gh release download --repo Loyalsoldier/v2ray-rules-dat --pattern 'geoip.dat' --dir NovaVPN/app/src/main/assets/geo --clobber
          ls -la NovaVPN/app/src/main/assets/geo

      - name: Show libv2ray API (for debugging)
        continue-on-error: true
        run: |
          mkdir -p /tmp/aar && cd /tmp/aar
          unzip -oq "$GITHUB_WORKSPACE/NovaVPN/app/libs/libv2ray.aar" classes.jar
          unzip -oq classes.jar 'libv2ray/*' -d cls
          javap -cp cls libv2ray.Libv2ray libv2ray.CoreController libv2ray.CoreCallbackHandler

      - name: Build APK
        run: gradle -p NovaVPN assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NovaVPN-debug
          path: NovaVPN/app/build/outputs/apk/debug/*.apk
